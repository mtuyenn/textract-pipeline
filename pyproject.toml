[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "textract-lab-pipeline"
version = "1.0.0"
description = "Serverless invoice and form digitization for AWS Learner Lab"
requires-python = ">=3.12"
dependencies = ["boto3==1.43.110"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "PyYAML>=6,<7", "Pillow>=11,<13"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", ".", "tools"]
addopts = "-q"
